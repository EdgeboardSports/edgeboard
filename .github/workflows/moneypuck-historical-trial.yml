name: MoneyPuck historical research trial (one-off)
# Push-triggered execution request: 2026-10-28; historical research only.
on:
  push:
    paths:
      - .github/workflows/moneypuck-historical-trial.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Fixture date formatting corrected; fail-fast test before downloads.
      - name: Check advanced feature synthetic fixture before downloads
        run: node tests/shots-advanced.test.mjs
      - name: Download only explicitly published MoneyPuck historical skater archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 180 \
            --output /tmp/edgeboard-moneypuck-2025.zip \
            'https://peter-tanner.com/moneypuck/downloads/seasonPlayersSummary/skaters/2025.zip'
          test "$(stat -c%s /tmp/edgeboard-moneypuck-2025.zip)" -le 67108864
          sha256sum /tmp/edgeboard-moneypuck-2025.zip > moneypuck-2025.sha256.txt
      - name: Verify historical archive and run existing backtests (research only)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/moneypuck-game-rows.py /tmp/edgeboard-moneypuck-2025.zip 2025 > /tmp/moneypuck-2025-schema.json
          node scripts/moneypuck-backtest.mjs 2025 2026-07-01 /tmp/edgeboard-moneypuck-2025.zip > moneypuck-2025-shots.json
          node scripts/points-backtest.mjs 2025 2026-07-01 /tmp/edgeboard-moneypuck-2025.zip > moneypuck-2025-points.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          shots=json.loads(Path('moneypuck-2025-shots.json').read_text())
          points=json.loads(Path('moneypuck-2025-points.json').read_text())
          summary={'season':'2025-26','researchOnly':True,'noHistoricalOdds':True,'shots':{k:shots.get(k) for k in ('forecasts','modelBrier','baselineBrier','pairedBrierImprovement','audit','firstTest','lastTest')},'points':{k:points.get(k) for k in ('forecasts','summary','robustness','audit','firstTest','lastTest')}}
          Path('moneypuck-2025-summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - name: Diagnose fixed shots-v1 model without tuning or promoting
        shell: bash
        run: |
          set -euo pipefail
          node scripts/shots-diagnostic.mjs 2025 2026-07-01 /tmp/edgeboard-moneypuck-2025.zip > moneypuck-2025-shots-diagnostic.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('moneypuck-2025-shots-diagnostic.json').read_text())
          print(json.dumps({k:x[k] for k in ('headline','dateClusterUncertainty','byMonth','byVenueFactor','byOpponentFactor','byIceTimeFactor','byDispersion')},indent=2))
          PY
      - name: Run five-model chronological comparison (research only)
        shell: bash
        run: |
          set -euo pipefail
          node tests/shots-variants.test.mjs
          node scripts/shots-variants.mjs 2025 2026-07-01 /tmp/edgeboard-moneypuck-2025.zip 2026-01-15 > moneypuck-2025-shots-variants.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('moneypuck-2025-shots-variants.json').read_text())
          print(json.dumps({k:x[k] for k in ('checks','selectedOnDevelopment','development','laterEvaluation','selectedLaterVsBaseline','selectedLaterVsOriginal','selectedLaterUncertainty')},indent=2))
          PY
      - name: Download historical 2024-25 skater archive for advanced research
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 180 \
            --output /tmp/edgeboard-moneypuck-2024.zip \
            'https://peter-tanner.com/moneypuck/downloads/seasonPlayersSummary/skaters/2024.zip'
          test "$(stat -c%s /tmp/edgeboard-moneypuck-2024.zip)" -le 67108864
          sha256sum /tmp/edgeboard-moneypuck-2024.zip > moneypuck-2024.sha256.txt
      - name: Run advanced opponent defense and power-play feature research
        shell: bash
        run: |
          set -euo pipefail
          node tests/shots-advanced.test.mjs
          node scripts/shots-advanced.mjs 2024 2025-07-01 /tmp/edgeboard-moneypuck-2024.zip 2025-01-15 > moneypuck-2024-advanced.json
          node scripts/shots-advanced.mjs 2025 2026-07-01 /tmp/edgeboard-moneypuck-2025.zip 2026-01-15 > moneypuck-2025-advanced-replication.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          for season, name in [('2024-25','moneypuck-2024-advanced.json'),('2025-26 replication, previously inspected','moneypuck-2025-advanced-replication.json')]:
              x=json.loads(Path(name).read_text())
              print(json.dumps({'season':season,**{k:x[k] for k in ('checks','selectedOnDevelopment','development','laterEvaluation','selectedLaterVsSimplified','uncertainty')}},indent=2))
          PY
      - name: Upload aggregate research reports only, not source data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneypuck-2025-research-report
          path: |
            moneypuck-2025.sha256.txt
            moneypuck-2025-summary.json
            moneypuck-2025-shots.json
            moneypuck-2025-points.json
            moneypuck-2025-shots-diagnostic.json
            moneypuck-2025-shots-variants.json
            moneypuck-2024.sha256.txt
            moneypuck-2024-advanced.json
            moneypuck-2025-advanced-replication.json
          if-no-files-found: warn
          retention-days: 7
