name: MoneyPuck archive schema probe
on:
  push:
    paths:
      - .github/workflows/moneypuck-archive-schema-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect published archive metadata without extracting
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 --output /tmp/2024.zip 'https://peter-tanner.com/moneypuck/downloads/seasonPlayersSummary/skaters/2024.zip'
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/2024.zip') as z:
              print([(x.filename,x.file_size,x.flag_bits) for x in z.infolist()[:12]])
          PY
