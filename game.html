<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090f19"><title>Edgeboard · Matchup</title><link rel="stylesheet" href="/assets/ui.css?v=19"><script type="module" src="/assets/ui.js?v=19"></script></head><body data-page="game"><header class="page-header"><span class="eyebrow">MATCHUP WORKSPACE</span><h1 id="title">Every angle. One game.</h1><p>Game markets and player props share the same matchup.</p></header><main><section class="card"><div class="matchup-header"><div id="matchup" class="matchup-versus"><span class="chip">NHL</span></div><div class="toolbar"><label>Matchup<select id="event"><option>Loading matchups…</option></select></label></div></div><p id="context" role="status">Loading the game feed…</p></section><div class="view-tabs" role="tablist" aria-label="Matchup view"><button id="markets-tab" role="tab" aria-selected="true" aria-controls="markets-panel">Game markets</button><button id="props-tab" role="tab" aria-selected="false" aria-controls="props-panel">Player props</button></div><div id="markets-panel" role="tabpanel" aria-labelledby="markets-tab"><p class="frame-loading">Loading game-market tools…</p><iframe class="matchup-frame" id="markets-frame" title="Game market analysis"></iframe></div><div id="props-panel" role="tabpanel" aria-labelledby="props-tab" hidden><iframe class="matchup-frame" id="props-frame" title="Player prop analysis"></iframe></div></main><footer>Quotes load only when requested. Models remain experimental; inspect checks before treating an estimate as evidence.</footer><script type="module">
import {el,teamLogo} from '/assets/ui.js?v=19';import {cleanName} from '/prop-history.js';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);let events=[],codes=new Map(),selected=null,active='markets';
const read=async path=>{const r=await fetch(path);if(!r.ok)throw Error('Feed unavailable');return r.json()};
function frameSrc(kind){if(!selected)return;const frame=$(kind+'-frame');if(frame.dataset.event===selected.id)return;frame.dataset.event=selected.id;frame.src=(kind==='props'?'/props':'/game-markets')+'?event='+selected.id+'&embed=1'}
function switchView(kind){active=kind;for(const name of ['markets','props']){$(name+'-panel').hidden=name!==kind;$(name+'-tab').setAttribute('aria-selected',String(name===kind));$(name+'-tab').tabIndex=name===kind?0:-1}frameSrc(kind)}
function choose(){selected=events.find(e=>e.id===$('event').value);if(!selected)return;const url=new URL(location.href);url.searchParams.set('event',selected.id);history.replaceState(null,'',url);$('title').textContent=(codes.get(cleanName(selected.awayTeam))||selected.awayTeam)+' at '+(codes.get(cleanName(selected.homeTeam))||selected.homeTeam);$('matchup').replaceChildren(teamLogo(codes.get(cleanName(selected.awayTeam))),el('span','at','versus-label'),teamLogo(codes.get(cleanName(selected.homeTeam))));$('context').textContent=selected.awayTeam+' @ '+selected.homeTeam+' · listed start '+new Date(selected.commenceTime).toLocaleString('en-US',{timeZone:'America/New_York',weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' ET';frameSrc(active);for(const link of document.querySelectorAll('.nav-link'))if(link.textContent.trim()==='Matchup')link.href='/game?event='+selected.id}
for(const name of ['markets','props']){$(name+'-tab').onclick=()=>switchView(name);$(name+'-tab').onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const next=name==='markets'?'props':'markets';switchView(next);$(next+'-tab').focus()}}}
addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='edgeboard:height')return;for(const id of ['markets-frame','props-frame']){const frame=$(id);if(e.source===frame.contentWindow&&Number.isFinite(e.data.height))frame.style.height=Math.max(360,Math.min(30000,e.data.height+10))+'px'}});
$('event').onchange=choose;$('markets-frame').onload=()=>{document.querySelector('.frame-loading').hidden=true};
try{const results=await Promise.allSettled([read('/api/nhl-events'),read('/api/game-archive')]);if(results[0].status!=='fulfilled')throw Error();events=results[0].value.events||[];const names=results[1].status==='fulfilled'?results[1].value.teamNames||{}:{};codes=new Map(Object.entries(names).map(([c,n])=>[cleanName(n),c]));$('event').replaceChildren();for(const e of events)$('event').append(new Option(e.awayTeam+' @ '+e.homeTeam,e.id));const wanted=events.find(e=>e.id===params.get('event'))||events.find(e=>Date.parse(e.commenceTime)>Date.now())||events[0];if(wanted){$('event').value=wanted.id;choose();if(params.get('tab')==='props')switchView('props')}else $('context').textContent='No current matchups are available from the odds feed.'}catch{$('context').textContent='The game feed could not load. Please refresh.'}
</script></body></html>
